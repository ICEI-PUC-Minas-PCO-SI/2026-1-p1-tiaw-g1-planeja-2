<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlanejaMais | Meu Perfil</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="layout">

        <!-- Menu lateral -->
        <aside class="navegacao">

            <div class="logo">
                <img src="img/logo.png" alt="PlanejaMais">
            </div>

            <nav class="menu">

                <a href="dashboard.html" class="menu-item">
                    <i class="bi bi-house-door-fill"></i>
                    Dashboard
                </a>

                <a href="receitas.html" class="menu-item">
                    <i class="bi bi-cash-stack"></i>
                    Receitas
                </a>

                <a href="despesas.html" class="menu-item">
                    <i class="bi bi-wallet2"></i>
                    Despesas
                </a>

                <a href="relatorios.html" class="menu-item">
                    <i class="bi bi-bar-chart-fill"></i>
                    Relatórios
                </a>

                <a href="perfil.html" class="menu-item" style="background:#1f2937;">
                    <i class="bi bi-person-circle"></i>
                    Meu Perfil
                </a>

            </nav>

            <div class="perfil-usuario">

                <img src="img/user.png" class="foto-usuario" alt="Usuário">

                <div class="info-usuario">
                    <h4>Mariana</h4>
                    <span>Administrador</span>
                </div>

            </div>

        </aside>

        <!-- Conteúdo -->
        <main class="conteudo">

            <div class="card-perfil">

                <h2>Meu Perfil</h2>

                <div class="foto-centro">

                    <img src="img/user.png" class="foto-perfil" id="fotoPerfil" alt="Foto do Perfil">

                    <input
                        type="file"
                        id="inputFoto"
                        accept="image/*"
                        style="display:none;">

                    <button type="button" id="btnFoto">
                        Alterar Foto
                    </button>

                </div>

                <div class="linha">

                    <div class="campo">
                        <label for="nome">Nome Completo</label>
                        <input
                            type="text"
                            id="nome"
                            placeholder="Digite seu nome">
                    </div>

                    <div class="campo">
                        <label for="email">E-mail</label>
                        <input
                            type="email"
                            id="email"
                            placeholder="Digite seu e-mail">
                    </div>

                </div>

                <div class="linha">

                    <div class="campo">
                        <label for="senha">Senha</label>
                        <input
                            type="password"
                            id="senha"
                            placeholder="********">
                    </div>

                    <div class="campo">
                        <label for="telefone">Telefone</label>
                        <input
                            type="text"
                            id="telefone"
                            placeholder="(31) 99999-9999">
                    </div>

                </div>

                <div class="linha">

                    <div class="campo">
                        <label for="data">Data de nascimento</label>
                        <input
                            type="date"
                            id="data">
                    </div>

                    <div class="campo">
                        <label for="genero">Gênero</label>

                        <select id="genero">

                            <option value="" selected disabled>Selecione</option>
                            <option value="Feminino">Feminino</option>
                            <option value="Masculino">Masculino</option>
                            <option value="Prefiro não informar">Prefiro não informar</option>

                        </select>

                    </div>

                </div>

                <div class="botoes">

                    <button
                        type="button"
                        class="salvar"
                        id="btnSalvar">

                        <i class="bi bi-check-circle"></i>
                        Salvar

                    </button>

                    <button
                        type="button"
                        class="cancelar"
                        id="btnCancelar">

                        <i class="bi bi-x-circle"></i>
                        Cancelar

                    </button>

                    <button
                        type="button"
                        class="sair"
                        id="btnSair">

                        <i class="bi bi-box-arrow-right"></i>
                        Sair

                    </button>

                </div>

            </div>

        </main>

    </div>

    <script src="scripts.js"></script>

</body>

</html>
