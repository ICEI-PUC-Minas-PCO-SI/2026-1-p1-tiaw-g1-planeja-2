<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Planeja++</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

    <div class="layout">

        <aside class="navegacao">

            <div class="logo">
                <img src="../assets/images/logo.png" alt="Logo PlanejaMais" class="logo-img">
            </div>

            <nav class="menu">

                <a href="#" class="menu-item">
                    <i class="fa-solid fa-house"></i>
                    Dashboard
                </a>

                <a href="#" class="menu-item">
                    <i class="fa-solid fa-layer-group"></i>
                    Transações
                </a>

                <a href="#" class="menu-item">
                    <i class="fa-solid fa-wallet"></i>
                    Contas
                </a>

                <a href="#" class="menu-item">
                    <i class="fa-solid fa-chart-pie"></i>
                    Planejamento
                </a>

                <a href="#" class="menu-item">
                    <i class="fa-solid fa-tags"></i>
                    Categorias
                </a>

                <a href="#" class="menu-item">
                    <i class="fa-solid fa-graduation-cap"></i>
                    Educação Financeira
                </a>

                <a href="#" class="menu-item">
                    <i class="fa-solid fa-gear"></i>
                    Configurações
                </a>

            </nav>

            <div class="perfil-usuario">

                <img src="../assets/images/user.png" alt="Usuário" class="foto-usuario">

                <div class="info-usuario">
                    <h4>Mariana Silva</h4>
                    <span>Ver perfil</span>
                </div>

            </div>

        </aside>

        <main class="container">

            <div class="form-contaFixa">

                <div class="campo">

                    <label for="nomeContaFixa">
                        Data
                    </label>

                    <input type="text" id="nomeContaFixa" placeholder="Ex: Alimentação">

                    <label for="nomeContaFixa">
                        Descrição
                    </label>

                    <input type="text" id="nomeContaFixa" placeholder="Ex: Alimentação">

                    <label for="nomeContaFixa">
                        Categoria
                    </label>

                    <input type="text" id="nomeContaFixa" placeholder="Ex: Alimentação">

                    <label for="nomeContaFixa">
                        Valor
                    </label>

                    <input type="text" id="nomeContaFixa" placeholder="Ex: Alimentação">

                    <label for="nomeContaFixa">
                        Forma de pagamento
                    </label>

                    <input type="text" id="nomeContaFixa" placeholder="Ex: Alimentação">

                    <label for="nomeContaFixa">
                        Tipo de transação
                    </label>

                    <input type="text" id="nomeContaFixa" placeholder="Ex: Alimentação">

                    <button class="btn-salvar" onclick="salvarCategoria()">Salvar</button>

                </div>

            </div>

            <div class="lista-categorias" id="listaCategorias"></div>

        </main>
    </div>

    <script src="script.js"></script>

</body>

</html>
