<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PlanejaMais</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <div class="header">
      <h1>Planejamento</h1>
    </div>

    <form id="formMeta">

      <div class="campo">
        <label>Nome da Meta(*)</label>
        <input 
          type="text" 
          id="nomeMeta" 
          placeholder="Informe o nome da meta"
          required
        >
      </div>

      <div class="linha">

        <div class="campo">
          <label>Valor Objetivo da Meta</label>

          <input 
            type="number" 
            id="valorObjetivo" 
            placeholder="Digite apenas números"
          >
        </div>

        <div class="campo">
          <label>Prazo de Conclusão</label>

          <input 
            type="date" 
            id="prazo"
             min=""
          >
        </div>

      </div>

      <div class="botoes-form">

        <button type="submit" class="btn-primary">
          Salvar
        </button>

        <button type="button" class="btn-secondary" onclick="limparFormulario()">
          Limpar
        </button>

      </div>

    </form>

    <div class="titulo-metas">
      <h2>Suas Metas Atuais</h2>
    </div>

    <div id="listaMetas"></div>

  </div>

  <script src="script.js"></script>

</body>
</html>
