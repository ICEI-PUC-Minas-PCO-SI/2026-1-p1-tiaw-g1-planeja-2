            </div>

    <div class="offcanvas offcanvas-start" tabindex="-1" id="menuLateral">

            <nav class="menu-mobile">

            </nav>

        </div>

    </div>



    <main class="conteudo">

        <section class="card form-card-page">

            <div class="card-header">

                <h2>Adicionar Transação</h2>
                <p>
                    Preencha os dados da movimentação
                </p>

            </div>

            <form id="transactionForm">

                <div class="form-group">

                    <label for="data">Data</label>
                    <input type="date" id="data" required>

                </div>

                <div class="form-group">
                    <label for="descricao">Descrição</label>
                    <input type="text" id="descricao" placeholder="Ex: Mercado, salário, cinema..." required>
                </div>

                <div class="form-group">
                    <label for="categoria">Categoria</label>
                    <select id="categoria" required>

                        <option value="">
                            Selecione
                        </option>

                        <option value="Salário">
                            Salário
                        </option>

                        <option value="Lazer">
                            Lazer
                        </option>

                        <option value="Alimentação">
                            Alimentação
                        </option>

                        <option value="Transporte">
                            Transporte
                        </option>

                    </select>

                </div>

                <div class="form-group">
                    <label for="valor">Valor</label>
                    <input type="number" id="valor" placeholder="0,00" step="0.01" min="0" required>
                </div>

                <div class="form-group">
                    <label for="formaPagamento">Forma de pagamento</label>
                    <select id="formaPagamento" required>

                        <option value="">Selecione</option>

                        <option value="Pix">
                            Pix
                        </option>

                        <option value="Cartão de crédito">
                            Cartão de crédito
                        </option>

                        <option value="Conta bancária">
                            Conta bancária
                        </option>

                        <option value="Dinheiro">
                            Dinheiro
                        </option>

                    </select>

                </div>

                <div class="form-group">
                    <label for="tipo">Tipo de transação</label>
                    <select id="tipo" required>

                        <option value="">Selecione</option>

                        <option value="entrada">
                            Entrada
                        </option>

                        <option value="saida">
                            Saída
                        </option>

                    </select>

                </div>

                <div class="form-buttons">
                    <button type="button" class="btn-secondary"
                        onclick="window.location.href='index.html'">Cancelar</button>

                    <button type="submit" class="btn-primary">Salvar</button>
                </div>

            </form>

        </section>

    </main>

    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
</body>
