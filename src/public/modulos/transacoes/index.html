<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planeja Mais</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

    <aside class="navegacao">

        <div class="logo">
            <img src="../../assets/images/logo.png" alt="Logo PlanejaMais" class="logo-img">
        </div>

        <nav class="menu">

            <a href="../dashboard/index.html" class="menu-item">
                <i class="fa-solid fa-house"></i>
                Dashboard
            </a>

            <a href="index.html" class="menu-item">
                <i class="fa-solid fa-layer-group"></i>
                Transações
            </a>

            <a href="../contaFixa/index.html" class="menu-item">
                <i class="fa-solid fa-wallet"></i>
                Contas
            </a>

            <a href="../metas/index.html" class="menu-item">
                <i class="fa-solid fa-chart-pie"></i>
                Planejamento
            </a>

            <a href="../categorias/index.html" class="menu-item">
                <i class="fa-solid fa-tags"></i>
                Categorias
            </a>

            <a href="../educacaoFinanceira/index.html" class="menu-item">
                <i class="fa-solid fa-graduation-cap"></i>
                Educação Financeira
            </a>

            <a href="#" class="menu-item">
                <i class="fa-solid fa-gear"></i>
                Configurações
            </a>

        </nav>

        <div class="perfil-usuario">

            <img src="../../assets/images/user.png" alt="Usuário" class="foto-usuario">

            <div class="info-usuario">
                <h4>Mariana Silva</h4>
                <span>Ver perfil</span>
            </div>

        </div>

    </aside>

    <main class="container">

        <section class="card table-card">

            <div class="card-header table-header">

                <div>
                    <h2>Transações</h2>
                    <p>
                        Gerencie suas movimentações financeiras
                    </p>
                </div>

                <button class="btn-primary" onclick="window.location.href='nova-transacao.html'">
                    Nova transação
                </button>

            </div>

            <div class="table-wrapper">

                <table>

                    <thead>

                        <tr>
                            <th>Data</th>
                            <th>Descrição</th>
                            <th>Categoria</th>
                            <th>Tipo</th>
                            <th>Forma de pagamento</th>
                            <th>Valor</th>
                            <th>Ações</th>
                        </tr>

                    </thead>

                    <tbody id="transactionTable">

                    </tbody>

                </table>

            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
