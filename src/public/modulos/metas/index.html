<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PlanejaMais</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="layout">

    <aside class="navegacao">

      <div class="logo">
        <img src="../assets/images/logo.png" alt="Logo PlanejaMais">
      </div>

      <nav class="menu">

        <a href="#" class="menu-item">
          <i class="fa-solid fa-house"></i>
          Dashboard
        </a>

        <a href="#" class="menu-item">
          <i class="fa-solid fa-layer-group"></i>
          Transações
        </a>

        <a href="#" class="menu-item">
          <i class="fa-solid fa-wallet"></i>
          Contas
        </a>

        <a href="#" class="menu-item">
          <i class="fa-solid fa-chart-pie"></i>
          Planejamento
        </a>

        <a href="#" class="menu-item">
          <i class="fa-solid fa-tags"></i>
          Categorias
        </a>

        <a href="#" class="menu-item ativo">
          <i class="fa-solid fa-graduation-cap"></i>
          Educação Financeira
        </a>

        <a href="#" class="menu-item">
          <i class="fa-solid fa-gear"></i>
          Configurações
        </a>

      </nav>

      <div class="perfil-usuario">

        <img src="../assets/images/user.png" alt="Usuário" class="foto-usuario">

        <div class="info-usuario">
          <h4>Mariana Silva</h4>
          <span>Ver perfil</span>
        </div>

      </div>

    </aside>

    <div class="container">

      <div class="header">
        <h1>Planejamento</h1>
      </div>

      <form id="formMeta">

        <div class="campo">
          <label>Nome da Meta(*)</label>
          <input type="text" id="nomeMeta" placeholder="Informe o nome da meta" required>
        </div>

        <div class="linha">

          <div class="campo">
            <label>Valor Objetivo da Meta</label>

            <input type="number" id="valorObjetivo" placeholder="Digite apenas números">
          </div>

          <div class="campo">
            <label>Prazo de Conclusão</label>

            <input type="date" id="prazo" min="">
          </div>

        </div>

        <div class="botoes-form">

          <button type="submit" class="btn-primary">
            Salvar
          </button>

          <button type="button" class="btn-secondary" onclick="limparFormulario()">
            Limpar
          </button>

        </div>

      </form>

      <div class="titulo-metas">
        <h2>Suas Metas Atuais</h2>
      </div>

      <div id="listaMetas"></div>

    </div>

    <script src="script.js"></script>

</body>

</html>
