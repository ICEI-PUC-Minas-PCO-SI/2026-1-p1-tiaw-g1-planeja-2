<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PlanejaMais</title>

  <link rel="stylesheet" href="style.css">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

  <div class="layout">

    <aside class="navegacao">

      <div class="logo">
        <img src="../../assets/images/logo.png" alt="Logo PlanejaMais">
      </div>

      <nav class="menu">

        <a href="../dashboard/index.html" class="menu-item">
          <i class="fa-solid fa-house"></i>
          Dashboard
        </a>

        <a href="../transacoes/index.html" class="menu-item">
          <i class="fa-solid fa-layer-group"></i>
          Transações
        </a>

        <a href="../contaFixa/index.html" class="menu-item">
          <i class="fa-solid fa-wallet"></i>
          Contas
        </a>

        <a href="../metas/index.html" class="menu-item">
          <i class="fa-solid fa-chart-pie"></i>
          Planejamento
        </a>

        <a href="../categorias/index.html" class="menu-item">
          <i class="fa-solid fa-tags"></i>
          Categorias
        </a>

        <a href="../educacaoFinanceira/index.html" class="menu-item ativo">
          <i class="fa-solid fa-graduation-cap"></i>
          Educação Financeira
        </a>

        <a href="../configuracoes/index.html" class="menu-item">
          <i class="fa-solid fa-gear"></i>
          Configurações
        </a>

      </nav>

      <div class="perfil-usuario" onclick="window.location.href='../configuracoes/index.html'">

        <img src="../../assets/images/user.png" alt="Usuário" class="foto-usuario" id="fotoUsuarioMenu">

        <div class="info-usuario">
          <h4 id="nomeUsuarioMenu">Usuário</h4>
          <span>Ver perfil</span>
        </div>

      </div>
    </aside>

    <div class="container">

      <div class="header">
        <h1>Planejamento</h1>
      </div>

      <form id="formMeta">

        <div class="campo">
          <label>Nome da Meta(*)</label>
          <input type="text" id="nomeMeta" placeholder="Informe o nome da meta" required>
        </div>

        <div class="linha">

          <div class="campo">
            <label>Valor Objetivo da Meta</label>

            <input type="number" id="valorObjetivo" placeholder="Digite apenas números">
          </div>

          <div class="campo">
            <label>Prazo de Conclusão</label>

            <input type="date" id="prazo" min="">
          </div>

        </div>

        <div class="botoes-form">

          <button type="submit" class="btn-primary">
            Salvar
          </button>

          <button type="button" class="btn-secondary" onclick="limparFormulario()">
            Limpar
          </button>

        </div>

      </form>

      <div class="titulo-metas">
        <h2>Suas Metas Atuais</h2>
      </div>

      <div id="listaMetas"></div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>

</body>

</html>
