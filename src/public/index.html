<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Planeja+</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="auth-container">

        <section class="auth-card">

            <div class="logo-area">
                <img src="assets/images/logoCadastro-removebg-preview.png" alt="Planeja+">
                <p>Organize sua vida financeira</p>
            </div>

            <div class="tabs">
                <button id="btnLogin" class="tab ativo" onclick="mostrarLogin()">Login</button>
                <button id="btnCadastro" class="tab" onclick="mostrarCadastro()">Cadastro</button>
            </div>

            <form id="formLogin" class="form-auth">
                <label for="emailLogin">E-mail</label>
                <input type="email" id="emailLogin" placeholder="Digite seu e-mail">

                <label for="senhaLogin">Senha</label>
                <input type="password" id="senhaLogin" placeholder="Digite sua senha">

                <button type="submit">Entrar</button>
            </form>

            <form id="formCadastro" class="form-auth oculto">
                <label for="nomeCadastro">Nome</label>
                <input type="text" id="nomeCadastro" placeholder="Digite seu nome">

                <label for="emailCadastro">E-mail</label>
                <input type="email" id="emailCadastro" placeholder="Digite seu e-mail">

                <label for="senhaCadastro">Senha</label>
                <input type="password" id="senhaCadastro" placeholder="Crie uma senha">

                <label for="confirmarSenha">Confirmar senha</label>
                <input type="password" id="confirmarSenha" placeholder="Confirme sua senha">

                <button type="submit">Cadastrar</button>
            </form>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
